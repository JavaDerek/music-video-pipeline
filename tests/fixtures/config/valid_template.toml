[cast.Dianne]
role = "Lead Vocalist, smiling constantly, oblivious"
image = "{base}/cast/dianne_ref_01.jpg"

[cast.Rex]
role = "Drummer, background, never sings"
image = "{base}/cast/rex_ref.jpg"

[hardware]
name = "RTX 4090"
vram_gb = 24.0
min_chunk_seconds = 4.0
max_chunk_seconds = 15.0
recommended_nodes = ["SageAttention"]
