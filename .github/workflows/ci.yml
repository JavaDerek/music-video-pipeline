name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor (pyproject.toml); 3.13 exercises the
        # audioop-lts conditional dependency PEP 594 made necessary.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately the core install plus [dev] only -- no [align] or
      # [faces]. The suite must pass this way: Stage 1 mocks the stable-ts
      # model entirely and the seed-frame face-gate tests skip themselves via
      # pytest.importorskip("cv2") when OpenCV is absent. If a future test
      # silently needs one of those extras, this is what catches it -- see the
      # note on issue #51 §6 about the two tests that only looked
      # environmental.
      - run: pip install -e ".[dev]"

      - run: ruff check .

      # Integration tests need a real ffmpeg/claude binary (or a real render on
      # disk) and are deselected here, not skipped silently -- see the
      # `integration` marker registered in pyproject.toml. Each self-skips if
      # run directly without what it needs, but deselecting keeps the CI run's
      # intent explicit. `pytest --collect-only -q -m integration` lists them.
      - run: pytest -m "not integration"

      # Issue #68: the stereo warp's 400 byte-for-byte equivalence cases need
      # numpy, which the core run above deliberately lacks. Install the
      # [stereo] extra only now, AFTER the core run has proven nothing else
      # needs it, and run only the stereo tests (no coverage floor: a single
      # file cannot meet the package-wide 80%).
      - run: pip install -e ".[stereo]"
      - run: pytest tests/test_stereo.py -m "not integration" --no-cov
